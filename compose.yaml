services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      API_APP_NAME: ${API_APP_NAME:-Portfolio API}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-["https://noel.fyi"]}
      API_LLM_BASE_URL: ${API_LLM_BASE_URL:-http://ollama:8080}
      API_EMBEDDINGS_BASE_URL: ${API_EMBEDDINGS_BASE_URL:-http://ollama:8080}
      API_RERANKING_BASE_URL: ${API_RERANKING_BASE_URL:-http://ollama:8080}
      API_LLM_BEARER_TOKEN: ${API_LLM_BEARER_TOKEN:-}
      API_EMBEDDING_MODEL: ${API_EMBEDDING_MODEL:-llm-embedder.Q8_0}
      API_EMBEDDINGS_PATH: ${API_EMBEDDINGS_PATH:-/v1/embeddings}
      API_EMBEDDING_PREFIX: ${API_EMBEDDING_PREFIX}
      API_EMBEDDING_PASSAGE_PREFIX: ${API_EMBEDDING_PASSAGE_PREFIX}
      API_RERANKER_MODEL: ${API_RERANKER_MODEL:-bge-reranker-v2-m3-Q8_0}
      API_RERANKER_PATH: ${API_RERANKER_PATH:-/rerank}
      API_LLM_MODEL: ${API_LLM_MODEL:-SmolLM2-360M-Instruct-Q8_0}
      API_CHAT_COMPLETIONS_PATH: ${API_CHAT_COMPLETIONS_PATH:-/v1/chat/completions}
      API_CHAT_MAX_TOKENS: ${API_CHAT_MAX_TOKENS:-256}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        BUILD_VERSION: ${BUILD_VERSION:-development}
        COMMIT_SHA: ${COMMIT_SHA:-development}
        BUILT_AT: ${BUILT_AT:-development}
        PUBLIC_OPENPANEL_CLIENT_ID: ${PUBLIC_OPENPANEL_CLIENT_ID:-}
        PUBLIC_OPENPANEL_API_URL: ${PUBLIC_OPENPANEL_API_URL:-}
        PUBLIC_OPENPANEL_SCRIPT_URL: ${PUBLIC_OPENPANEL_SCRIPT_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  default:
    name: portfolio
