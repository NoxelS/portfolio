services:
  redis:
    image: redis/redis-stack:latest
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "${REDIS_INSIGHT_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      API_APP_NAME: ${API_APP_NAME:-Portfolio API}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-DEBUG}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-["https://noel.fyi"]}
      API_LLM_BASE_URL: ${API_LLM_BASE_URL:-http://ollama:8080}
      API_EMBEDDINGS_BASE_URL: ${API_EMBEDDINGS_BASE_URL:-http://ollama:8080}
      API_RERANKING_BASE_URL: ${API_RERANKING_BASE_URL:-http://ollama:8080}
      API_LLM_BEARER_TOKEN: ${API_LLM_BEARER_TOKEN:-}
      API_EMBEDDING_MODEL: ${API_EMBEDDING_MODEL:-llm-embedder.Q8_0}
      API_EMBEDDINGS_PATH: ${API_EMBEDDINGS_PATH:-/v1/embeddings}
      API_EMBEDDING_PREFIX: ${API_EMBEDDING_PREFIX}
      API_EMBEDDING_PASSAGE_PREFIX: ${API_EMBEDDING_PASSAGE_PREFIX}
      API_RERANKER_MODEL: ${API_RERANKER_MODEL:-bge-reranker-v2-m3-Q8_0}
      API_RERANKER_PATH: ${API_RERANKER_PATH:-/rerank}
      API_RERANKER_MINIMUM_RELEVANCE_PERCENT: ${API_RERANKER_MINIMUM_RELEVANCE_PERCENT:-0.1}
      API_LLM_MODEL: ${API_LLM_MODEL:-SmolLM2-360M-Instruct-Q8_0}
      API_CHAT_COMPLETIONS_PATH: ${API_CHAT_COMPLETIONS_PATH:-/v1/chat/completions}
      API_CHAT_MAX_TOKENS: ${API_CHAT_MAX_TOKENS:-256}
      API_CHAT_MODEL_CONTEXT_TOKENS: ${API_CHAT_MODEL_CONTEXT_TOKENS:-8192}
      API_CHAT_CONTEXT_RESERVED_TOKENS: ${API_CHAT_CONTEXT_RESERVED_TOKENS:-768}
      API_REDIS_URL: ${API_REDIS_URL:-redis://redis:6379}
      API_REDIS_INDEX_NAME: ${API_REDIS_INDEX_NAME:-portfolio_content}
      API_ASSISTANT_TOP_N: ${API_ASSISTANT_TOP_N:-8}
      API_RETRIEVAL_MAX_TOP_N: ${API_RETRIEVAL_MAX_TOP_N:-40}
      API_RETRIEVAL_MULTIPLIER: ${API_RETRIEVAL_MULTIPLIER:-6}
      API_RETRIEVAL_MAX_K: ${API_RETRIEVAL_MAX_K:-120}
      API_CONTENT_ROOT: ${API_CONTENT_ROOT:-/app/content}
      API_INSTRUCTIONS_ROOT: ${API_INSTRUCTIONS_ROOT:-/app/instructions}
      API_BOOTSTRAP_CHUNK_SIZE: ${API_BOOTSTRAP_CHUNK_SIZE:-500}
      API_BOOTSTRAP_CHUNK_OVERLAP: ${API_BOOTSTRAP_CHUNK_OVERLAP:-100}
      API_NTFY_ENABLED: ${API_NTFY_ENABLED:-false}
      API_NTFY_TOPIC: ${API_NTFY_TOPIC:-}
      API_NTFY_HOST: ${API_NTFY_HOST:-https://ntfy.sh}
      API_NTFY_USER: ${API_NTFY_USER:-}
      API_NTFY_PASSWORD: ${API_NTFY_PASSWORD:-}
      API_NTFY_TITLE: ${API_NTFY_TITLE:-Portfolio Sales Assistant}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./content:/app/content:ro
      - ./instructions:/app/instructions:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        BUILD_VERSION: ${BUILD_VERSION:-development}
        COMMIT_SHA: ${COMMIT_SHA:-development}
        BUILT_AT: ${BUILT_AT:-development}
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
        PUBLIC_OPENPANEL_CLIENT_ID: ${PUBLIC_OPENPANEL_CLIENT_ID:-}
        PUBLIC_OPENPANEL_API_URL: ${PUBLIC_OPENPANEL_API_URL:-}
        PUBLIC_OPENPANEL_SCRIPT_URL: ${PUBLIC_OPENPANEL_SCRIPT_URL:-}
        OPENPANEL_CLIENT_SECRET: ${OPENPANEL_CLIENT_SECRET:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  default:
    name: portfolio
