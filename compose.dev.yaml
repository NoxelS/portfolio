services:
  redis:
    image: redis/redis-stack:latest
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "${REDIS_INSIGHT_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      API_APP_NAME: "${API_APP_NAME:-Portfolio API}"
      API_LOG_LEVEL: "${API_LOG_LEVEL:-DEBUG}"
      API_CORS_ORIGINS: '${API_CORS_ORIGINS:-["http://localhost:4321","http://127.0.0.1:4321"]}'
      API_LLM_BASE_URL: "${API_LLM_BASE_URL:-https://ai.noel.fyi}"
      API_EMBEDDINGS_BASE_URL: "${API_EMBEDDINGS_BASE_URL:-https://ai.noel.fyi}"
      API_RERANKING_BASE_URL: "${API_RERANKING_BASE_URL:-https://ai.noel.fyi}"
      API_HTTP_TIMEOUT_SECONDS: "${API_HTTP_TIMEOUT_SECONDS:-300}"
      API_OPENWEBUI_API_KEY: "${API_OPENWEBUI_API_KEY:-}"
      API_EMBEDDING_MODEL: "${API_EMBEDDING_MODEL:-embedding-bge}"
      API_EMBEDDINGS_PATH: "${API_EMBEDDINGS_PATH:-/openai/embeddings}"
      API_EMBEDDING_PREFIX: "${API_EMBEDDING_PREFIX:-query: }"
      API_EMBEDDING_PASSAGE_PREFIX: "${API_EMBEDDING_PASSAGE_PREFIX:-passage: }"
      API_RERANKER_MODEL: "${API_RERANKER_MODEL:-reranking-bge}"
      API_RERANKER_PATH: "${API_RERANKER_PATH:-/openai/rerank}"
      API_RERANKER_MINIMUM_RELEVANCE_PERCENT: "${API_RERANKER_MINIMUM_RELEVANCE_PERCENT:-0.1}"
      API_LLM_MODEL: "${API_LLM_MODEL:-phi}"
      API_CHAT_COMPLETIONS_PATH: "${API_CHAT_COMPLETIONS_PATH:-/openai/chat/completions}"
      API_MODELS_PATH: "${API_MODELS_PATH:-/openai/models}"
      API_CHAT_MAX_TOKENS: "${API_CHAT_MAX_TOKENS:-256}"
      API_CHAT_MODEL_CONTEXT_TOKENS: "${API_CHAT_MODEL_CONTEXT_TOKENS:-8192}"
      API_CHAT_CONTEXT_RESERVED_TOKENS: "${API_CHAT_CONTEXT_RESERVED_TOKENS:-768}"
      API_REDIS_URL: "redis://redis:6379"
      API_REDIS_INDEX_NAME: "${API_REDIS_INDEX_NAME:-portfolio_content}"
      API_ASSISTANT_TOP_N: "${API_ASSISTANT_TOP_N:-8}"
      API_RETRIEVAL_MAX_TOP_N: "${API_RETRIEVAL_MAX_TOP_N:-25}"
      API_RETRIEVAL_MULTIPLIER: "${API_RETRIEVAL_MULTIPLIER:-3}"
      API_RETRIEVAL_MAX_K: "${API_RETRIEVAL_MAX_K:-75}"
      API_BOOTSTRAP_CHUNK_SIZE: "${API_BOOTSTRAP_CHUNK_SIZE:-500}"
      API_BOOTSTRAP_CHUNK_OVERLAP: "${API_BOOTSTRAP_CHUNK_OVERLAP:-100}"
      API_NTFY_ENABLED: "${API_NTFY_ENABLED:-false}"
      API_NTFY_TOPIC: "${API_NTFY_TOPIC:-}"
      API_NTFY_HOST: "${API_NTFY_HOST:-https://ntfy.sh}"
      API_NTFY_USER: "${API_NTFY_USER:-}"
      API_NTFY_PASSWORD: "${API_NTFY_PASSWORD:-}"
      API_NTFY_TITLE: "${API_NTFY_TITLE:-Portfolio Sales Assistant}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/api:/app/api:ro
      - ./content:/app/content:ro
      - ./instructions:/app/instructions:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8000}"
      PUBLIC_OPENPANEL_CLIENT_ID: "${PUBLIC_OPENPANEL_CLIENT_ID:-}"
      PUBLIC_OPENPANEL_API_URL: "${PUBLIC_OPENPANEL_API_URL:-}"
      PUBLIC_OPENPANEL_SCRIPT_URL: "${PUBLIC_OPENPANEL_SCRIPT_URL:-}"
      PUBLIC_BUILD_VERSION: "${BUILD_VERSION:-development}"
      PUBLIC_COMMIT_SHA: "${COMMIT_SHA:-development}"
      PUBLIC_BUILT_AT: "${BUILT_AT:-development}"
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  frontend_node_modules:

networks:
  default:
    name: portfolio-dev
