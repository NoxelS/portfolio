[project]
name = "api"
version = "0.1.0"
description = "Portfolio RAG API backend"
readme = "README.md"
authors = [
    { name = "Noel Schwabenland", email = "noel@schwabenland.ch" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
