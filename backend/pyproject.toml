[project]
name = "api"
version = "0.1.0"
description = "Portfolio RAG API backend"
readme = "README.md"
authors = [
    { name = "Noel Schwabenland", email = "noel@schwabenland.ch" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "ntfy>=2.7.1",
    "pydantic-settings>=2.14.1",
    "python-frontmatter>=1.1.0",
    "redis>=6.4.0",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
chat-probe = "api.chat_probe:main"
embed-live = "api.embed_live:main"
embed-probe = "api.embed_probe:main"
rag-probe = "api.dev_probe:main"
rerank-probe = "api.rerank_probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
