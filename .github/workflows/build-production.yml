name: Build production image

on:
  workflow_call:

concurrency:
  group: production-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/noxels/portfolio-frontend

jobs:
  publish:
    name: Publish production image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read and validate release version
        id: version
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable production version: $version" >&2
            exit 1
          fi
          if git tag --list "v${version}" | grep -q .; then
            echo "Production version v${version} already exists; promote a new version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.environment=production
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Build production image for verification
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_DEPLOYMENT_ENV=production
            PUBLIC_CLOUDFLARE_IMAGE_RESIZING=true
            PUBLIC_BUILD_VERSION=${{ steps.version.outputs.version }}
            PUBLIC_COMMIT_SHA=${{ github.sha }}
            PUBLIC_BUILT_AT=${{ steps.version.outputs.built_at }}
          cache-from: type=gha,scope=frontend-production
          cache-to: type=gha,mode=max,scope=frontend-production
      - name: Smoke test production image
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/smoke-production-image.sh "$IMAGE_NAME:$RELEASE_VERSION" "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: Push verified production image
        id: push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            docker push "$image"
          done <<< "$IMAGE_TAGS"
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:$RELEASE_VERSION")"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          printf '## Production image\n\nVersion: %s\n\nCommit: %s\n\nImage: %s\n' \
            "$RELEASE_VERSION" "$GITHUB_SHA" "$image_ref" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          printf 'Production image: %s\n\nSource commit: %s\n' \
            "$IMAGE_REF" "$GITHUB_SHA" > "$RUNNER_TEMP/production-release.md"
          gh release create "v${RELEASE_VERSION}" --target "$GITHUB_SHA" \
            --title "v${RELEASE_VERSION}" --generate-notes \
            --notes-file "$RUNNER_TEMP/production-release.md"
