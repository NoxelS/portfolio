name: Build staging image

on:
  push:
    branches: [main]

concurrency:
  group: staging-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/noxels/portfolio-frontend

jobs:
  publish:
    name: Publish frontend-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read application version
        id: version
        working-directory: frontend
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-staging.${{ github.run_number }}
            type=sha,prefix=sha-
            type=raw,value=frontend-staging
          labels: |
            org.opencontainers.image.environment=staging
            org.opencontainers.image.version=${{ steps.version.outputs.version }}-staging.${{ github.run_number }}
      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_DEPLOYMENT_ENV=staging
            PUBLIC_BUILD_VERSION=${{ steps.version.outputs.version }}-staging.${{ github.run_number }}
            PUBLIC_COMMIT_SHA=${{ github.sha }}
            PUBLIC_BUILT_AT=${{ github.run_started_at }}
          cache-from: type=gha,scope=frontend-staging
          cache-to: type=gha,mode=max,scope=frontend-staging
