name: Promote to production

on:
  workflow_dispatch:

concurrency:
  group: production-promotion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: Prepare production promotion
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare release branch from main
        id: release
        run: bash .github/scripts/prepare-production-release.sh
      - name: Push release branch
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
      - name: Report promotion pull request link
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const { GITHUB_REPOSITORY, GITHUB_STEP_SUMMARY, RELEASE_BRANCH, RELEASE_VERSION, SOURCE_SHA } = process.env;
          const url = new URL(`https://github.com/${GITHUB_REPOSITORY}/compare/production...${RELEASE_BRANCH}`);
          url.searchParams.set('expand', '1');
          url.searchParams.set('title', `chore(release): promote ${RELEASE_VERSION}`);
          url.searchParams.set('body', `Promotes the complete website source from main at ${SOURCE_SHA}.\n\nVersion: ${RELEASE_VERSION}\n\nReview staging and wait for Verify frontend before merging. Merging publishes the production image and a GitHub release; deployment is managed separately.`);
          appendFileSync(GITHUB_STEP_SUMMARY, `## Production promotion ${RELEASE_VERSION}\n\n[Open promotion pull request](${url})\n\nCreate the PR, review staging, and wait for Verify frontend before merging.\n`);
          console.log(`Open production promotion PR: ${url}`);
          NODE
