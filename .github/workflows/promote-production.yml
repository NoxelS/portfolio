name: Promote to production

on:
  workflow_dispatch:

concurrency:
  group: production-promotion
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Create production promotion PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare release branch from main
        id: release
        run: bash .github/scripts/prepare-production-release.sh
      - name: Push release branch
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
      - name: Create promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          cat > "$RUNNER_TEMP/production-promotion.md" <<EOF
          Promotes the complete website source from main at ${SOURCE_SHA}.

          Version: ${RELEASE_VERSION}

          Review the staging site, approve the PR workflows if GitHub requests it,
          and wait for Verify frontend before merging. Merging publishes the
          production image and a GitHub release; deployment is managed separately.
          EOF
          gh pr create --base production --head "$RELEASE_BRANCH" \
            --title "chore(release): promote $RELEASE_VERSION" \
            --body-file "$RUNNER_TEMP/production-promotion.md"
