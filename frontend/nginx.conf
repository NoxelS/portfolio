server {
    listen 4321;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    etag on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|woff2?|avif|webp|png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400, s-maxage=604800, stale-while-revalidate=86400" always;
        add_header CDN-Cache-Control "public, max-age=86400, s-maxage=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location ~* \.(?:txt|md|xml|json)$ {
        add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=600" always;
        add_header CDN-Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=600" always;
        try_files $uri =404;
    }

    location = /health {
        default_type application/json;
        add_header Cache-Control "public, max-age=30, s-maxage=300, stale-while-revalidate=60" always;
        add_header CDN-Cache-Control "public, max-age=30, s-maxage=300, stale-while-revalidate=60" always;
        try_files /health =404;
    }

    location / {
        add_header Cache-Control "public, max-age=60, s-maxage=600, stale-while-revalidate=60" always;
        add_header CDN-Cache-Control "public, max-age=60, s-maxage=600, stale-while-revalidate=60" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
